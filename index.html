<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Union Street Retail Units</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css">
  <style>
    :root{color-scheme:light;--ink:#17221d;--muted:#5e6b64;--line:#d5ddd8;--panel:#fff;--accent:#1f5d43;--occupied:#5f9b73;--filled:#2f7f89;--available:#e6bd52;--not-market:#d58442;--being:#9fc8ea;--to-let:#9b7b24}
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:#edf1ee}
    body{display:grid;grid-template-rows:auto minmax(0,1fr)}
    .topbar{position:relative;z-index:5;padding:14px 16px;background:#fff;border-bottom:1px solid var(--line);box-shadow:0 4px 16px #17221d18}
    .topbar h1{margin:0;font-size:clamp(1.15rem,4vw,1.55rem)}
    .topbar p{margin:5px 0 0;color:var(--muted);font-size:.88rem;line-height:1.35}
    .status-tools{display:grid;grid-template-columns:112px minmax(0,1fr);align-items:center;gap:8px;margin-top:10px;max-width:620px}
    .status-tools label{font-size:.82rem;font-weight:700}
    .status-tools select{width:100%;min-width:0;padding:7px 30px 7px 9px;border:1px solid #b8c5bd;border-radius:8px;background:#f5f7f5;color:var(--ink);font:inherit}
    .status-totals{grid-column:1/-1;margin:0!important;font-size:.76rem!important}
    .layout{position:relative;min-height:0}
    #map{position:absolute;inset:0;background:#dfe6e1}
    .panel{position:absolute;z-index:4;left:12px;right:12px;bottom:12px;max-height:44%;overflow:auto;padding:14px;background:color-mix(in srgb,var(--panel) 96%,transparent);border:1px solid #cbd5cf;border-radius:14px;box-shadow:0 8px 30px #17221d2a}
    .panel[hidden]{display:none}
    .panel h2{margin:0 34px 5px 0;font-size:1.05rem}
    .panel p{margin:4px 0;color:var(--muted);font-size:.85rem;line-height:1.35}
    .panel .property-address{margin:0 34px 10px 0;color:var(--muted);font-size:.9rem}
    .panel .status{display:inline-block;margin:0 0 12px;padding:5px 9px;border:1px solid #0002;border-radius:999px;color:#17221d;font-size:.78rem;font-weight:800}
    .info-section{margin:2px 0 14px;padding-top:11px;border-top:1px solid var(--line)}
    .info-section h3{margin:0 0 7px;font-size:.82rem;letter-spacing:.02em;text-transform:uppercase;color:#425149}
    .property-fields{display:grid;grid-template-columns:minmax(105px,.75fr) minmax(0,1fr);gap:6px 12px;margin:0;font-size:.82rem;line-height:1.35}
    .property-fields dt{color:var(--muted)}
    .property-fields dd{min-width:0;margin:0;font-weight:650;overflow-wrap:anywhere}
    .property-fields code{font-size:.76rem;font-weight:500}
    .not-recorded{color:#7a8580;font-weight:500!important;font-style:italic}
    .osm-records{display:grid;gap:8px;margin:8px 0}
    .osm-record{padding:9px 10px;background:#f1f5f2;border-left:4px solid #6f9a7e;border-radius:6px}
    .osm-record strong,.osm-record span{display:block}
    .osm-record span{margin-top:2px;color:var(--muted);font-size:.8rem}
    .excluded{margin:9px 0;color:var(--muted);font-size:.8rem}
    .excluded summary{cursor:pointer;font-weight:700}
    .close{position:absolute;right:9px;top:8px;width:32px;height:32px;border:0;border-radius:50%;background:#eef2ef;color:#273a31;font-size:1.2rem;cursor:pointer}
    .legend{position:absolute;z-index:4;top:12px;left:12px;padding:10px 11px;background:#fffffff2;border:1px solid #cbd5cf;border-radius:11px;box-shadow:0 4px 18px #17221d1f;font-size:.75rem}
    .legend strong{display:block;margin-bottom:6px;font-size:.8rem}
    .legend span{display:flex;align-items:center;gap:6px;margin:4px 0}
    .legend i{width:12px;height:12px;border-radius:3px;border:1px solid #0002}
    .maplibregl-ctrl .view-toggle{min-width:36px;height:36px;padding:0 8px;border:0;background:#fff;color:#263c32;font:700 12px/36px Inter,ui-sans-serif,system-ui,sans-serif;cursor:pointer}
    .maplibregl-ctrl .view-toggle:hover{background:#eef2ef}
    .map-error{position:absolute;z-index:6;inset:20px;display:none;place-items:center;padding:24px;background:#fff;border:1px solid var(--line);border-radius:14px;text-align:center}
    .maplibregl-ctrl-attrib{font-size:10px}
    @media(min-width:760px){.topbar{padding:15px 22px}.panel{left:auto;right:18px;bottom:18px;width:340px;max-height:58%;padding:17px}.legend{top:18px;left:18px}.maplibregl-ctrl-bottom-right{right:0;bottom:0}}
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
  </style>
</head>
<body>
  <header class="topbar">
    <h1>Union Street Retail Units</h1>
    <div class="status-tools">
      <label for="status-filter">Highlight status</label>
      <select id="status-filter">
        <option value="all">All statuses</option>
        <option value="all-occupied">All Occupied</option>
        <option value="occupied">Occupied</option>
        <option value="filled">Occupied: Filled</option>
        <option value="occupied-to-let">Occupied: To Let</option>
        <option value="all-vacant">All Vacant</option>
        <option value="available">Vacant: To Let</option>
        <option value="not-on-market">Vacant: Not on Market</option>
        <option value="being-occupied">Vacant: Being Filled</option>
      </select>
      <p class="status-totals" id="status-totals" aria-live="polite"></p>
    </div>
  </header>
  <main class="layout">
    <div id="map" role="application" aria-label="Interactive building map of Union Street, Castlegate and Castle Street"></div>
    <div class="legend" aria-label="Unit status key">
      <strong>Unit Status</strong>
      <span><i style="background:var(--occupied)"></i>Occupied</span>
      <span><i style="background:var(--filled)"></i>Occupied: Filled</span>
      <span><i style="background:var(--to-let)"></i>Occupied: To Let</span>
      <span><i style="background:var(--available)"></i>Vacant: To Let</span>
      <span><i style="background:var(--not-market)"></i>Vacant: Not on Market</span>
      <span><i style="background:var(--being)"></i>Vacant: Being Filled</span>
    </div>
    <section class="panel" id="details" aria-live="polite" hidden></section>
    <div class="map-error" id="map-error"><div><h2>Map could not be loaded</h2><p>This prototype needs an internet connection for the map library and background tiles. Its building overlay is stored locally.</p></div></div>
  </main>
  <script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>
  <script src="union-street-central-buildings.js?v=20260922-3"></script>
  <script src="union-street-central-osm-features.js?v=20260922-2"></script>
  <script src="union-street-east-buildings.js?v=20260923-4"></script>
  <script src="union-street-east-osm-features.js?v=20260922-2"></script>
  <script src="union-street-west-buildings.js?v=20260922-3"></script>
  <script src="union-street-west-osm-features.js?v=20260922-2"></script>
  <script src="union-street-central-frontages.js?v=20260924-38"></script>
  <script src="union-street-central-addresses.js?v=20260924-26"></script>
  <script>
    (async()=>{
      const details=document.getElementById('details');
      const error=document.getElementById('map-error');
      const statusFilter=document.getElementById('status-filter');
      const statusTotals=document.getElementById('status-totals');
      const addressRecords=globalThis.UNION_STREET_CENTRAL_ADDRESSES||{};
      const buildingOverrides=globalThis.UNION_STREET_CENTRAL_BUILDING_OVERRIDES||{};
      const osmFeatureRecords={...(globalThis.UNION_STREET_CENTRAL_OSM_FEATURES||{}),...(globalThis.UNION_STREET_EAST_OSM_FEATURES||{}),...(globalThis.UNION_STREET_WEST_OSM_FEATURES||{})};
      const labels={occupied:'Occupied',filled:'Occupied: Filled',available:'Vacant: To Let','not-on-market':'Vacant: Not on Market','being-occupied':'Vacant: Being Filled','occupied-to-let':'Occupied: To Let',context:'Context building'};
      const colours={occupied:'#5f9b73',filled:'#2f7f89',available:'#e6bd52','not-on-market':'#d58442','being-occupied':'#9fc8ea','occupied-to-let':'#9b7b24',context:'#bcc5bf'};
      if(!globalThis.maplibregl||!globalThis.UNION_STREET_CENTRAL_BUILDINGS){error.style.display='grid';return}
      const knownBuildingIds=new Set(globalThis.UNION_STREET_CENTRAL_BUILDINGS.features.map(feature=>feature.properties.buildingId));
      (globalThis.UNION_STREET_EAST_BUILDINGS?.features||[]).forEach(feature=>{if(!knownBuildingIds.has(feature.properties.buildingId)){globalThis.UNION_STREET_CENTRAL_BUILDINGS.features.push(feature);knownBuildingIds.add(feature.properties.buildingId)}});
      (globalThis.UNION_STREET_WEST_BUILDINGS?.features||[]).forEach(feature=>{if(!knownBuildingIds.has(feature.properties.buildingId)){globalThis.UNION_STREET_CENTRAL_BUILDINGS.features.push(feature);knownBuildingIds.add(feature.properties.buildingId)}});
      globalThis.UNION_STREET_CENTRAL_BUILDINGS.features.forEach(feature=>{
        const record=addressRecords[feature.properties.buildingId];
        const override=buildingOverrides[feature.properties.buildingId];
        if(record){
          feature.properties.address=record.displayAddress||feature.properties.address;
          feature.properties.name=record.buildingName||feature.properties.name;
          if(record.status)feature.properties.status=record.status;
          feature.properties.addressSource=record.source||'Local address register';
          feature.properties.addressVerified=Boolean(record.verified);
          feature.properties.unitCount=Array.isArray(record.units)?record.units.length:0;
        }
        if(override){
          if(typeof override.frontage==='boolean')feature.properties.frontage=override.frontage;
          if(override.frontage===false)feature.properties.status='context';
          feature.properties.viewerRelevance=override.relevance||'';
          feature.properties.viewerRelevanceReason=override.reason||'';
        }
      });
      globalThis.UNION_STREET_CENTRAL_BUILDINGS.features=globalThis.UNION_STREET_CENTRAL_BUILDINGS.features.filter(feature=>buildingOverrides[feature.properties.buildingId]?.visible!==false);
      const frontageFeatures=globalThis.UNION_STREET_CENTRAL_FRONTAGES?.features||[];
      function edgePrisms(feature,widthMetres,height){
        const ring=feature.geometry.coordinates[0];
        const latitude=ring.reduce((sum,point)=>sum+point[1]/ring.length,0);
        const metresPerLongitude=111320*Math.cos(latitude*Math.PI/180);
        const metresPerLatitude=111320;
        return ring.slice(0,-1).flatMap((start,index)=>{
          const end=ring[index+1];
          const dx=(end[0]-start[0])*metresPerLongitude;
          const dy=(end[1]-start[1])*metresPerLatitude;
          const length=Math.hypot(dx,dy)||1;
          const offsetX=(-dy/length)*(widthMetres/2)/metresPerLongitude;
          const offsetY=(dx/length)*(widthMetres/2)/metresPerLatitude;
          const edgeRing=[
            [start[0]+offsetX,start[1]+offsetY],
            [end[0]+offsetX,end[1]+offsetY],
            [end[0]-offsetX,end[1]-offsetY],
            [start[0]-offsetX,start[1]-offsetY]
          ];
          edgeRing.push(edgeRing[0]);
          const halfPostLongitude=(widthMetres/2)/metresPerLongitude;
          const halfPostLatitude=(widthMetres/2)/metresPerLatitude;
          const postRing=[
            [start[0]-halfPostLongitude,start[1]-halfPostLatitude],
            [start[0]+halfPostLongitude,start[1]-halfPostLatitude],
            [start[0]+halfPostLongitude,start[1]+halfPostLatitude],
            [start[0]-halfPostLongitude,start[1]+halfPostLatitude],
            [start[0]-halfPostLongitude,start[1]-halfPostLatitude]
          ];
          const commonProperties={frontageId:feature.properties.frontageId||'',buildingId:feature.properties.buildingId||'',blockKind:feature.properties.blockKind,status:feature.properties.status,edgeHeight:height};
          return [{
            type:'Feature',
            properties:{...commonProperties,baseHeight:7.9},
            geometry:{type:'Polygon',coordinates:[edgeRing]}
          },{
            type:'Feature',
            properties:{...commonProperties,baseHeight:0},
            geometry:{type:'Polygon',coordinates:[postRing]}
          }];
        });
      }
      let baseMapExtrusionLayers=[];
      const subdividedParents=new Set(frontageFeatures.map(feature=>feature.properties.parentBuildingId));
      globalThis.UNION_STREET_CENTRAL_BUILDINGS.features.forEach(feature=>{
        feature.properties.subdividedParent=subdividedParents.has(feature.properties.buildingId);
      });
      const countedBuildings=globalThis.UNION_STREET_CENTRAL_BUILDINGS.features.filter(feature=>feature.properties.frontage&&!subdividedParents.has(feature.properties.buildingId));
      const countedUnits=[...countedBuildings,...frontageFeatures];
      const context3dBuildingIds=new Set([
        'osm-way-404892147',
        'osm-relation-16307644',
        'osm-way-642545736',
        'osm-way-404933589',
        'osm-way-764468596',
        'osm-way-1215644296',
        'osm-way-463771007',
        'osm-way-1149234682',
        'osm-way-404609510',
        'osm-way-314142351',
        'osm-way-314142352',
        'osm-way-1001881114',
        'osm-way-1001881112',
        'osm-way-1001881113'
      ]);
      const context3dBuildings=globalThis.UNION_STREET_CENTRAL_BUILDINGS.features.filter(feature=>context3dBuildingIds.has(feature.properties.buildingId));
      const loweredContextBuildingIds=new Set(['osm-way-404933589','osm-way-1215644296']);
      await loadUnitRegister(countedUnits);
      const heightPilotUnits={type:'FeatureCollection',features:[...context3dBuildings,...countedUnits].map(feature=>({
        ...feature,
        properties:{...feature.properties,blockKind:feature.properties.frontageId?'frontage':'building',baseHeight:0,unitHeight:loweredContextBuildingIds.has(feature.properties.buildingId)&&!feature.properties.frontageId?7.9:8,heightSource:'Prototype frontage-block height'}
      }))};
      const heightPilotEdges={type:'FeatureCollection',features:heightPilotUnits.features.flatMap(feature=>edgePrisms(feature,.24,feature.properties.unitHeight+.12))};
      const statusOrder=['occupied','filled','occupied-to-let','available','not-on-market','being-occupied'];
      const statusGroups={'all-occupied':['occupied','filled','occupied-to-let'],'all-vacant':['available','not-on-market','being-occupied']};
      const groupLabels={'all-occupied':'All Occupied','all-vacant':'All Vacant'};
      const totals=Object.fromEntries(statusOrder.map(status=>[status,countedUnits.filter(feature=>feature.properties.status===status).length]));
      const countFor=value=>statusGroups[value]?statusGroups[value].reduce((sum,status)=>sum+(totals[status]||0),0):totals[value]||0;
      let selectedUnitId='';
      let selectedUnitKind='';
      [...statusFilter.options].forEach(option=>{option.textContent=option.value==='all'?`All statuses (${countedUnits.length})`:`${groupLabels[option.value]||labels[option.value]} (${countFor(option.value)})`});
      function renderTotals(){
        const selected=statusFilter.value;
        const highlighted=selected==='all'?countedUnits.length:countFor(selected);
        statusTotals.innerHTML=`<strong>${highlighted}</strong> of <strong>${countedUnits.length}</strong> mapped frontage records highlighted · ${statusOrder.filter(status=>totals[status]).map(status=>`${labels[status]} ${totals[status]}`).join(' · ')}`;
      }
      const map=new maplibregl.Map({container:'map',style:'https://tiles.openfreemap.org/styles/liberty',center:[-2.0987,57.14655],zoom:17.35,bearing:-74,pitch:0,attributionControl:false});
      globalThis.unionStreetMap=map;
      map.addControl(new maplibregl.NavigationControl({showCompass:false}),'bottom-left');
      class ViewToggleControl{
        onAdd(activeMap){
          this.map=activeMap;
          this.container=document.createElement('div');
          this.container.className='maplibregl-ctrl maplibregl-ctrl-group';
          this.button=document.createElement('button');
          this.button.className='view-toggle';
          this.button.type='button';
          this.button.textContent='3D';
          this.button.title='Show 3D frontage blocks along the mapped street';
          this.button.setAttribute('aria-label',this.button.title);
          this.button.addEventListener('click',()=>{
            const going3d=this.map.getPitch()<15;
            this.map.easeTo({pitch:going3d?58:0,bearing:going3d?-74:-74,duration:700});
          });
          this.container.appendChild(this.button);
          return this.container;
        }
        onRemove(){this.container.remove();this.map=undefined}
        update(){
          const is3d=this.map.getPitch()>=15;
          this.button.textContent=is3d?'2D':'3D';
          this.button.title=is3d?'Return to the flat map':'Show 3D frontage blocks along the mapped street';
          this.button.setAttribute('aria-label',this.button.title);
        }
      }
      const viewToggle=new ViewToggleControl();
      map.addControl(viewToggle,'bottom-left');
      map.addControl(new maplibregl.AttributionControl({compact:true,customAttribution:'Prototype building data © OpenStreetMap contributors'}),'bottom-right');
      map.on('load',()=>{
        baseMapExtrusionLayers=(map.getStyle().layers||[])
          .filter(layer=>layer.type==='fill-extrusion')
          .map(layer=>({id:layer.id,visibility:map.getLayoutProperty(layer.id,'visibility')||'visible'}));
        map.addSource('central-buildings',{type:'geojson',data:globalThis.UNION_STREET_CENTRAL_BUILDINGS});
        map.addLayer({id:'building-fill',type:'fill',source:'central-buildings',paint:{'fill-color':['match',['get','status'],...Object.entries(colours).flat(),'#bcc5bf'],'fill-opacity':['case',['get','frontage'],.78,.36]}});
        map.addLayer({id:'building-outline',type:'line',source:'central-buildings',paint:{'line-color':['case',['get','frontage'],'#263c32','#78857e'],'line-width':['case',['get','frontage'],1.8,.7]}});
        map.addLayer({id:'selected-building-outline',type:'line',source:'central-buildings',filter:['==',['get','buildingId'],''],paint:{'line-color':'#ffd84d','line-width':7,'line-blur':1.2,'line-opacity':1}});
        if(globalThis.UNION_STREET_CENTRAL_FRONTAGES){
          map.addSource('central-frontages',{type:'geojson',data:globalThis.UNION_STREET_CENTRAL_FRONTAGES});
          map.addLayer({id:'retail-frontage',type:'fill',source:'central-frontages',paint:{'fill-color':['match',['get','status'],...Object.entries(colours).flat(),'#bcc5bf'],'fill-opacity':.88}});
          map.addLayer({id:'retail-frontage-outline',type:'line',source:'central-frontages',paint:{'line-color':'#263c32','line-width':2}});
          map.addLayer({id:'selected-frontage-outline',type:'line',source:'central-frontages',filter:['==',['get','frontageId'],''],paint:{'line-color':'#ffd84d','line-width':7,'line-blur':1.2,'line-opacity':1}});
        }
        map.addSource('height-pilot-units',{type:'geojson',data:heightPilotUnits});
        map.addLayer({id:'height-pilot-units',type:'fill-extrusion',source:'height-pilot-units',paint:{
          'fill-extrusion-base':['get','baseHeight'],
          'fill-extrusion-height':['get','unitHeight'],
          'fill-extrusion-color':['match',['get','status'],...Object.entries(colours).flat(),'#bcc5bf'],
          'fill-extrusion-opacity':0
        }});
        map.addSource('height-pilot-edges',{type:'geojson',data:heightPilotEdges});
        map.addLayer({id:'height-pilot-edges',type:'fill-extrusion',source:'height-pilot-edges',paint:{
          'fill-extrusion-base':['get','baseHeight'],
          'fill-extrusion-height':['get','edgeHeight'],
          'fill-extrusion-color':'#17221d',
          'fill-extrusion-opacity':0
        }});
        map.fitBounds([[-2.11265,57.14215],[-2.09135,57.14910]],{padding:{top:54,bottom:145,left:40,right:40},duration:0});
        applyStatusHighlight();
        update3dView();
      });
      map.on('pitch',update3dView);
      function update3dView(){
        const is3d=map.getPitch()>=15;
        const selected=statusFilter.value;
        const selectedStatusMatch=statusGroups[selected]?['in',['get','status'],['literal',statusGroups[selected]]]:['==',['get','status'],selected];
        const pilotStatusMatch=['any',selectedStatusMatch,['==',['get','status'],'context']];
        baseMapExtrusionLayers.forEach(layer=>{
          if(map.getLayer(layer.id))map.setLayoutProperty(layer.id,'visibility',is3d?'none':layer.visibility);
        });
        if(map.getLayer('height-pilot-units')){
          map.setFilter('height-pilot-units',selected==='all'?null:pilotStatusMatch);
          map.setPaintProperty('height-pilot-units','fill-extrusion-opacity',is3d?1:0);
        }
        if(map.getLayer('height-pilot-edges')){
          map.setFilter('height-pilot-edges',selected==='all'?null:pilotStatusMatch);
          map.setPaintProperty('height-pilot-edges','fill-extrusion-opacity',is3d?1:0);
        }
        if(map.getLayer('selected-building-outline'))map.setPaintProperty('selected-building-outline','line-opacity',is3d?0:1);
        if(map.getLayer('selected-frontage-outline'))map.setPaintProperty('selected-frontage-outline','line-opacity',is3d?0:1);
        if(viewToggle.button)viewToggle.update();
      }
      statusFilter.addEventListener('change',()=>{clearSelection(true);applyStatusHighlight()});
      function applyStatusHighlight(){
        const selected=statusFilter.value;
        renderTotals();
        if(!map.getLayer('building-fill'))return;
        const statusMatch=statusGroups[selected]?['in',['get','status'],['literal',statusGroups[selected]]]:['==',['get','status'],selected];
        const selectableBuildingMatch=['all',['!', ['get','subdividedParent']],statusMatch];
        const contextBuildingMatch=['==',['get','status'],'context'];
        const buildingOpacity=selected==='all'?['case',['get','frontage'],.78,.22]:['case',contextBuildingMatch,.22,selectableBuildingMatch,['case',['get','frontage'],.92,.28],0];
        map.setPaintProperty('building-fill','fill-opacity',buildingOpacity);
        map.setPaintProperty('building-outline','line-width',selected==='all'?['case',['get','frontage'],1.8,.7]:['case',contextBuildingMatch,.7,selectableBuildingMatch,2.8,0]);
        if(map.getLayer('retail-frontage')){
          map.setPaintProperty('retail-frontage','fill-opacity',selected==='all'?.88:['case',statusMatch,.95,0]);
          map.setPaintProperty('retail-frontage-outline','line-width',selected==='all'?2:['case',statusMatch,3,0]);
        }
        if(map.getLayer('height-pilot-units'))update3dView();
      }
      function showFrontageDetails(event){
        const clicked=event.features&&event.features[0]&&event.features[0].properties;
        if(!clicked)return;
        const p=frontageFeatures.find(feature=>feature.properties.frontageId===clicked.frontageId)?.properties||clicked;
        const record=addressRecords[p.parentBuildingId];
        const linkedUnit=findLinkedUnit(record,p);
        selectUnit(p.frontageId,'frontage');
        renderPropertyCard({...linkedUnit,...p});
      }
      map.on('click','retail-frontage',showFrontageDetails);
      map.on('click','building-fill',event=>{
        if(map.getLayer('retail-frontage')&&map.queryRenderedFeatures(event.point,{layers:['retail-frontage']}).length)return;
        const feature=event.features&&event.features[0];
        if(!feature)return;
        showBuildingDetails(feature);
      });
      function showBuildingDetails(feature){
        const p=feature.properties;
        const record=addressRecords[p.buildingId];
        const linkedUnit=record&&Array.isArray(record.units)&&record.units.length===1?record.units[0]:{};
        selectUnit(p.buildingId,'building');
        renderPropertyCard({...record,...linkedUnit,...p});
      }
      function renderPropertyCard(p){
        const vacant=['available','not-on-market','being-occupied'].includes(p.status);
        const title=vacant?'Vacant':p.name||p.buildingName||'Occupant not recorded';
        const address=p.address||p.displayAddress||'Address not recorded';
        const statusLabel=labels[p.status]||p.status||'Status not recorded';
        const rateableValue=propertyValue(p,['rateableValue','rateable_value','rv'],'currency');
        const vacancyFields=vacant?sectionHtml('Vacancy information',[
          ['Area',propertyValue(p,['areaSqFt','area_sq_ft','area'],'area')],
          ['Rates',propertyValue(p,['rates','annualRates','annual_rates'],'annual')],
          ['Rent',propertyValue(p,['rent','annualRent','annual_rent'],'annual')],
          ['AR&R / sq ft',propertyValue(p,['arrPerSqFt','arr_per_sq_ft','arrSqFt'],'perSqFt')]
        ]):'';
        details.innerHTML=`<button class="close" type="button" aria-label="Close property details">×</button><h2>${escapeHtml(title)}</h2><p class="property-address">${escapeHtml(address)}</p><span class="status" style="background:${escapeHtml(colours[p.status]||'#e8eeea')}55">${escapeHtml(statusLabel)}</span>${sectionHtml('Rateable Value',[['Value',rateableValue]])}${vacancyFields}`;
        details.hidden=false;
        details.querySelector('.close').addEventListener('click',()=>clearSelection(true));
      }
      function selectUnit(unitId,kind){
        selectedUnitId=unitId||'';
        selectedUnitKind=kind||'';
        if(map.getLayer('selected-building-outline'))map.setFilter('selected-building-outline',['==',['get','buildingId'],selectedUnitKind==='building'?selectedUnitId:'']);
        if(map.getLayer('selected-frontage-outline'))map.setFilter('selected-frontage-outline',['==',['get','frontageId'],selectedUnitKind==='frontage'?selectedUnitId:'']);
        updateSelected3dEdges();
      }
      function clearSelection(hideDetails=false){
        selectedUnitId='';
        selectedUnitKind='';
        if(map.getLayer('selected-building-outline'))map.setFilter('selected-building-outline',['==',['get','buildingId'],'']);
        if(map.getLayer('selected-frontage-outline'))map.setFilter('selected-frontage-outline',['==',['get','frontageId'],'']);
        updateSelected3dEdges();
        if(hideDetails)details.hidden=true;
      }
      function updateSelected3dEdges(){
        if(!map.getLayer('height-pilot-edges'))return;
        const edgeUnitId=['case',['!=',['get','frontageId'],''],['get','frontageId'],['get','buildingId']];
        map.setPaintProperty('height-pilot-edges','fill-extrusion-color',selectedUnitId?['case',['==',edgeUnitId,selectedUnitId],'#ffd84d','#17221d']:'#17221d');
      }
      function showBlockDetails(event){
        const clicked=event.features&&event.features[0]&&event.features[0].properties;
        if(!clicked)return;
        if(clicked.blockKind==='frontage'||clicked.frontageId){
          showFrontageDetails(event);
          return;
        }
        const building=globalThis.UNION_STREET_CENTRAL_BUILDINGS.features.find(feature=>feature.properties.buildingId===clicked.buildingId);
        if(building)showBuildingDetails(building);
      }
      map.on('click','height-pilot-units',showBlockDetails);
      map.on('click','height-pilot-edges',showBlockDetails);
      map.on('click',event=>{
        if(map.getPitch()<15)return;
        const clickable3dLayers=['height-pilot-edges','height-pilot-units'].filter(layerId=>map.getLayer(layerId));
        if(!clickable3dLayers.length)return;
        const feature=map.queryRenderedFeatures(event.point,{layers:clickable3dLayers})[0];
        if(feature)showBlockDetails({features:[feature]});
      });
      map.on('mouseenter','building-fill',()=>{map.getCanvas().style.cursor='pointer'});
      map.on('mouseleave','building-fill',()=>{map.getCanvas().style.cursor=''});
      map.on('mouseenter','retail-frontage',()=>{map.getCanvas().style.cursor='pointer'});
      map.on('mouseleave','retail-frontage',()=>{map.getCanvas().style.cursor=''});
      map.on('mouseenter','height-pilot-units',()=>{map.getCanvas().style.cursor='pointer'});
      map.on('mouseleave','height-pilot-units',()=>{map.getCanvas().style.cursor=''});
      map.on('mouseenter','height-pilot-edges',()=>{map.getCanvas().style.cursor='pointer'});
      map.on('mouseleave','height-pilot-edges',()=>{map.getCanvas().style.cursor=''});
      map.on('error',event=>{if(!map.loaded()&&event.error)error.style.display='grid'});
      async function loadUnitRegister(features){
        try{
          const response=await fetch('data/union-street-units.csv',{cache:'no-store'});
          if(!response.ok)throw new Error(`CSV request returned ${response.status}`);
          const rows=parseCsv(await response.text());
          if(rows.length<2)throw new Error('CSV contains no property rows');
          const headers=rows[0].map((value,index)=>index===0?value.replace(/^\ufeff/,''):value);
          const records=rows.slice(1).filter(row=>row.some(Boolean)).map(row=>Object.fromEntries(headers.map((header,index)=>[header,row[index]??''])));
          const byId=new Map(features.map(feature=>[feature.properties.frontageId||feature.properties.buildingId,feature]));
          const seen=new Set();
          const validStatuses=new Set(['occupied','filled','occupied-to-let','available','not-on-market','being-occupied']);
          let matched=0;
          let issues=0;
          for(const record of records){
            const id=record.unit_id?.trim();
            if(!id||seen.has(id)){issues++;continue}
            seen.add(id);
            const feature=byId.get(id);
            if(!feature){issues++;continue}
            const status=record.status?.trim();
            if(status&&!validStatuses.has(status)){issues++;continue}
            const p=feature.properties;
            if(record.address)p.address=record.address.trim();
            if(record.occupant)p.name=record.occupant.trim();
            if(status)p.status=status;
            if(record.uprn)p.uprn=record.uprn.trim();
            if(record.source_note)p.sourceNote=record.source_note.trim();
            if(record.verification_date)p.verificationDate=record.verification_date.trim();
            if(record.verified)p.verified=/^(true|yes|1)$/i.test(record.verified.trim());
            for(const [column,property] of [
              ['rateable_value','rateableValue'],['area_sq_ft','areaSqFt'],['annual_rates','annualRates'],
              ['annual_rent','annualRent'],['arr_per_sq_ft','arrPerSqFt']
            ]){
              if(record[column]!==undefined&&record[column].trim()!==''){
                const value=Number(record[column].replace(/[£,]/g,'').trim());
                if(Number.isFinite(value))p[property]=value;else issues++;
              }
            }
            p.dataSource='CSV property register';
            matched++;
          }
          const missingIds=[...byId.keys()].filter(id=>!seen.has(id));
          issues+=missingIds.length;
          globalThis.UNION_STREET_CSV_LOAD={loaded:true,matched,issues,rows:records.length,missingIds};
          return globalThis.UNION_STREET_CSV_LOAD;
        }catch(error){
          console.warn('Union Street CSV register could not be loaded; using built-in data.',error);
          globalThis.UNION_STREET_CSV_LOAD={loaded:false,matched:0,issues:0,error:String(error)};
          return globalThis.UNION_STREET_CSV_LOAD;
        }
      }
      function parseCsv(text){
        const rows=[];
        let row=[];
        let value='';
        let quoted=false;
        for(let index=0;index<text.length;index++){
          const character=text[index];
          if(quoted){
            if(character==='"'&&text[index+1]==='"'){value+='"';index++}
            else if(character==='"')quoted=false;
            else value+=character;
          }else if(character==='"')quoted=true;
          else if(character===','){row.push(value);value=''}
          else if(character==='\n'){
            row.push(value.replace(/\r$/,''));
            rows.push(row);
            row=[];
            value='';
          }else value+=character;
        }
        if(value||row.length){row.push(value.replace(/\r$/,''));rows.push(row)}
        return rows;
      }
      function sectionHtml(title,rows,codeValues=false){
        return `<section class="info-section"><h3>${escapeHtml(title)}</h3><dl class="property-fields">${rows.map(([label,value])=>{
          const item=value&&typeof value==='object'?value:{text:value,missing:false};
          const rendered=codeValues&&!item.missing?`<code>${escapeHtml(item.text)}</code>`:escapeHtml(item.text);
          return `<dt>${escapeHtml(label)}</dt><dd${item.missing?' class="not-recorded"':''}>${rendered}</dd>`;
        }).join('')}</dl></section>`;
      }
      function propertyValue(data,keys,format){
        const value=keys.map(key=>data?.[key]).find(item=>item!==undefined&&item!==null&&item!=='');
        if(value===undefined)return {text:'Not recorded',missing:true};
        if(typeof value!=='number')return {text:String(value),missing:false};
        if(format==='area')return {text:`${value.toLocaleString('en-GB')} sq ft`,missing:false};
        if(format==='perSqFt')return {text:`£${value.toLocaleString('en-GB',{minimumFractionDigits:2,maximumFractionDigits:2})}`,missing:false};
        const currency=`£${value.toLocaleString('en-GB',{maximumFractionDigits:0})}`;
        return {text:format==='annual'?`${currency} pa`:currency,missing:false};
      }
      function findLinkedUnit(record,properties){
        if(!record||!Array.isArray(record.units))return {};
        const addressKey=value=>String(value||'').toLowerCase().replace(/,.*$/,'').replace(/\s+/g,' ').trim();
        const propertyAddress=addressKey(properties.address);
        return record.units.find(unit=>unit.name===properties.name||addressKey(unit.address)===propertyAddress)||{};
      }
      function findRelatedOsm(buildingId,properties,record){
        const items=(osmFeatureRecords[buildingId]||[]).map(item=>{
          const override=record?.osmFeatureOverrides?.[item.osmId];
          return override?{...item,...override}:item;
        }).filter(item=>item.relevance!=='not-relevant');
        const clean=value=>String(value||'').toLowerCase().replace(/,.*$/,'').trim();
        return items.find(item=>clean(item.name)===clean(properties.name)||clean(item.address)===clean(properties.address));
      }
      function osmIdFromBuildingId(value){
        const match=String(value||'').match(/^osm-(way|node|relation)-(.+)$/);
        return match?`${match[1]}/${match[2]}`:'';
      }
      function osmRecordHtml(item){
        const title=item.name||item.address||item.osmId;
        const meta=[friendlyCategory(item.category),item.address].filter(Boolean).join(' · ');
        const website=safeUrl(item.website);
        return `<div class="osm-record"><strong>${escapeHtml(title)}</strong>${meta?`<span>${escapeHtml(meta)}</span>`:''}${website?`<span><a href="${escapeHtml(website)}" target="_blank" rel="noopener">Website</a></span>`:''}</div>`;
      }
      function friendlyCategory(value){return String(value||'').replaceAll('_',' ').replace(/^./,letter=>letter.toUpperCase())}
      function safeUrl(value){try{const url=new URL(value);return ['http:','https:'].includes(url.protocol)?url.href:''}catch{return ''}}
      function escapeHtml(value){return String(value??'').replace(/[&<>'"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]))}
      renderTotals();
    })();
  </script>
